name: Update schedule

on:
  schedule:
    # Times are UTC (Toronto = UTC-4 in summer/fall, UTC-5 in winter)
    - cron: "17 */3 * * *"          # every 3 hours, all week
    - cron: "7 11-23 * * 6,0"       # hourly on Sat/Sun, ~7am–7pm Toronto (tournament days)
    - cron: "*/10 12-23 * * 6,0"    # game-day quick refresh every ~10 min (only publishes if we play today)
  push:
    branches: [main]                # rebuild right after you edit config or tournaments
  workflow_dispatch:                # "Run workflow" button in the Actions tab
    inputs:
      live:
        description: "Game-day quick refresh (only today's tournament)"
        type: boolean
        default: false

permissions:
  actions: write                    # lets a game-day run start the next one
  contents: write                   # save the cache back to the repo
  pages: write
  id-token: write

concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Parser tests (stop before publishing if timu.ca parsing broke)
        run: python -m pytest -q tests

      - name: Build site
        id: build
        env:
          LIVE_ONLY: ${{ (github.event.schedule == '*/10 12-23 * * 6,0' || inputs.live) && '1' || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python -m tracker.build

      - name: Save cache
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Update schedule cache [skip ci]"
          git pull --rebase || true
          git push || echo "push skipped"

      - if: steps.build.outputs.publish != 'false'
        uses: actions/configure-pages@v5
      - if: steps.build.outputs.publish != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.build.outputs.publish != 'false'
        id: deploy
        uses: actions/deploy-pages@v4

      # GitHub often delays or skips frequent scheduled runs. On game days, each run
      # waits ~8 minutes after publishing and starts the next one itself, until the
      # team's last match is done (or 9 pm). Public repo = no cost.
      - name: Schedule next game-day refresh
        if: steps.build.outputs.keep_live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 480
          gh workflow run update.yml --repo "${{ github.repository }}" --ref main -f live=true
